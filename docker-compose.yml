# Futtatás a szerveren Dockerrel (a GitHub által elkészített image-ből):
#   A GitHub (github.com/Killerkego/siparadicsom) minden main-re feltöltés után elkészíti az image-et, és a
#   deploy.yml telepíti a szerverre. Kézzel (az image privát, ezért előbb: docker login ghcr.io egy
#   read:packages jogú tokennel): docker compose pull && docker compose up -d
#
# A https://zsolt.codes kéréseit a szerveren futó Nginx Proxy Manager (NPM) fogadja a 80-as és 443-as porton,
# ő kéri a HTTPS-tanúsítványt is, és továbbadja a kéréseket (a WebSocketet is) ennek a konténernek.
# A játék nem nyit portot a szerveren kívülre: az NPM a saját „nginx-proxy-network” Docker-hálózatán éri el,
# a konténer nevén és belső portján: aranyhegy:8080
# Az NPM proxy hostja: Domain Names = zsolt.codes, www.zsolt.codes; Scheme = http; Forward Hostname = aranyhegy;
# Forward Port = 8080; Websockets Support = BE; SSL: Let's Encrypt, Force SSL.
services:
  aranyhegy:
    # a deploy.yml az IMAGE változóban adja meg az image-et; kézi indításnál ez az alapértelmezés
    image: ${IMAGE:-ghcr.io/killerkego/siparadicsom:latest}
    container_name: aranyhegy
    restart: unless-stopped
    networks:
      - nginx-proxy-network
    mem_limit: 256m
    cpus: 1.0
    # a konténer semmit sem ír: csak olvasható fájlrendszer, extra jogosultságok nélkül
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

networks:
  # az NPM hálózata (az NPM compose-fájljában is external); a deploy.yml létrehozza, ha még nincs
  nginx-proxy-network:
    external: true
    name: nginx-proxy-network
